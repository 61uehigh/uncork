name: Update Homebrew formula

# Points the uncork formula in 61uehigh/homebrew-tap at a new release.
# Needs the TAP_DEPLOY_KEY secret: the private half of a deploy key with write access to 61uehigh/homebrew-tap.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the formula at, e.g. v0.1.1
        required: true

permissions:
  contents: read

concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Compute the source tarball's checksum
        id: source
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output source.tar.gz "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: 61uehigh/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update and push the formula
        working-directory: tap
        env:
          URL: ${{ steps.source.outputs.url }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" \
            Formula/uncork.rb
          if git diff --quiet; then
            echo "Formula already points at ${TAG}."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "uncork ${TAG#v}"
          git push
